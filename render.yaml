# Blueprint Render — Pedidos Mayorista
# Dashboard: New > Blueprint > conectar repo pedidos-mayorista (rama main)

services:
  - type: web
    name: pedidos-mayorista-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: pedidos-mayorista-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: pedidos-mayorista-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: pedidos-mayorista-web
    env: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pedidos-mayorista-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_WS_URL
        fromService:
          type: web
          name: pedidos-mayorista-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: pedidos-mayorista-db
    databaseName: pedidos_mayorista
    user: pedidos_user
    plan: free
