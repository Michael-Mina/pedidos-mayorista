# Blueprint Render — Pedidos Mayorista
# Dashboard: New > Blueprint > repo pedidos-mayorista (rama main)

services:
  # API FastAPI + Socket.IO (plan free solo en servicios web con runtime)
  - type: web
    name: pedidos-mayorista-api
    runtime: python
    rootDir: backend
    plan: free
    # postgresql-client: pg_dump para respaldos desde Admin → Respaldo
    buildCommand: pip install -r requirements.txt && apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: pedidos-mayorista-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: pedidos-mayorista-web
          envVarKey: RENDER_EXTERNAL_URL

  # Sitio estático: sin "plan" (no aplica instance type en static)
  - type: web
    name: pedidos-mayorista-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # React Router: /login, /mayorista, etc. → index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pedidos-mayorista-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_WS_URL
        fromService:
          type: web
          name: pedidos-mayorista-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: pedidos-mayorista-db
    databaseName: pedidos_mayorista
    user: pedidos_user
    plan: free
